name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate pet assets
        run: npm run validate:pets

      - name: Build Windows installer
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.tools\electron-builder-cache
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cat-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $files = @()
          $files += Get-ChildItem -Path "dist\*.exe" | ForEach-Object { $_.FullName }
          $files += Get-ChildItem -Path "dist\*.blockmap" | ForEach-Object { $_.FullName }
          $files += Get-Item -Path "dist\latest.yml" | ForEach-Object { $_.FullName }

          gh release view $env:TAG_NAME *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG_NAME @files --clobber
          } else {
            gh release create $env:TAG_NAME @files --title $env:TAG_NAME --generate-notes
          }
